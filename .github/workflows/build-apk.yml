name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔨 Prepare Web Build (www)
        run: npm run prepare-build

      - name: ⚡ Capacitor Sync
        run: npx cap sync android

      - name: 🏗️ Build Android Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: 🚀 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronTitans-v1.0.0-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
